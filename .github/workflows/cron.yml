name: 低价股利好新闻定时爬取

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行爬虫
        run: python main.py

      - name: 发送结果邮件
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO_ADDR: ${{ secrets.MAIL_TO_ADDR }}
        run: python src/send_email.py || echo "邮件发送失败（不影响结果提交）"

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 定时更新低价股利好新闻 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

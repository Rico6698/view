name: 低价股利好新闻定时爬取

on:
  schedule:
    # 每天 10:00 和 17:00（Asia/Shanghai，即 UTC 02:00 / 09:00）
    - cron: '0 2,9 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行爬虫
        run: python main.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 定时更新低价股利好新闻 $(date -u +'%Y-%m-%d %H:%M' UTC)"
            git push
          fi
